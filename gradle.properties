# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# NFRT (asset download / source gen) runs on Java 21 regardless of the project toolchain.
# Point Gradle at the project-local JDK 21 so it does not try to download a toolchain.
org.gradle.java.installations.paths=E:\\PCL\\mod_develop\\.tools\\jdk-21.0.12.1+1

# Environment Properties
# Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.23-beta

## Mod Properties

mod_id=chestautosorter
mod_name=Chest Auto Sorter
mod_license=GPL-3.0-or-later
mod_version=0.1.0
mod_group_id=com.chestautosorter
mod_authors=Liuying
